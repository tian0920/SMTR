# MARBLE Real Environment Feasibility Test Configuration

# Data paths (existing MARBLE artifacts)
data:
  paired_records_path: artifacts/marble/paired/train/paired_records.jsonl
  validation_records_path: artifacts/marble/paired/validation/paired_records.jsonl
  test_records_path: artifacts/marble/paired/test/paired_records.jsonl
  memory_pool_path: artifacts/marble/real_data/database_v1/memory_pool.jsonl
  intervention_contrasts_path: artifacts/marble/interventions/p2_pilot_real/intervention_contrasts.jsonl
  tci_contrasts_path: artifacts/marble/interventions/p2_pilot_real/intervention_contrasts.jsonl
  tci_perturbations_manifest_path: artifacts/marble/interventions/p2_pilot_real/perturbations.json
  tci_ranker_path: artifacts/marble/interventions/p2_pilot_real/tci_ranker.joblib
  # All splits combined for informative sampling
  all_paired_splits:
    - artifacts/marble/paired/train/paired_records.jsonl
    - artifacts/marble/paired/validation/paired_records.jsonl
    - artifacts/marble/paired/test/paired_records.jsonl

# Environment
environment:
  marble_root: /home/ecs-user/MARBLE
  scenario: database
  n_agents: 2-4
  seeds: [0, 1, 2]

# Intervention sampling
sampling:
  strategy: informative  # random | informative
  target_total: 500
  target_positive_pct: 0.25
  target_negative_pct: 0.25
  # Informative sampling: upsample τ≠0, downsample τ=0
  upsample_seed: 42

# Probe training
probe:
  n_features: 32
  n_bootstrap: 7
  seed: 42
  max_epochs: 50
  feature_block: full
  critic_mode: flat
  # Class weights for balanced training
  class_weights:
    positive_transfer: 2.0
    negative_transfer: 2.0
    neutral_success: 0.5
    neutral_failure: 0.5
  # Sign classifier (z = sign(τ))
  sign_classifier: true
  # TCI alpha: weight of TCI ranking supervision
  tci_alpha: 3.0

# Evaluation
evaluation:
  n_pairwise_samples: 5000
  seed: 42
  # Only rank informative pairs (exclude τ=0 vs τ=0)
  informative_only_ranking: true

# Acceptance criteria for critic training stabilization
acceptance:
  # Criterion 1: In-distribution (random split) informative ranking >= 0.75
  in_distribution_ranking_min: 0.75
  # Criterion 2: Task split informative ranking > random
  task_holdout_ranking_min: 0.44
  # Criterion 3: Memory split ranking > random
  memory_holdout_beats_random: true
  # Criterion 4: SMTR > outcome-only by +10% (full ranking)
  smtr_vs_outcome_margin: 0.10

# Training modes to evaluate
training:
  modes:
    - regression   # Standard FourOutcomeTransferCritic (baseline)
    - ranking      # Pairwise ranking loss with Ridge
    - hybrid       # L_rank + 0.5*L_tau + 0.5*L_sign (recommended)
  # Best mode is selected by in-distribution ranking

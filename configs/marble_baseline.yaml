# MARBLE Baseline Comparison Configuration
# Unified experiment protocol for fair comparison of all memory controllers
# on real MARBLE multi-agent database tasks.
#
# Research Questions:
#   RQ1: Does TCI form more reliable long-term behavioral knowledge?
#   RQ2: Does validated knowledge transfer better than retrieval/reflection/heuristic?
#   RQ3: Does TCI reduce multi-agent memory contamination?

environment:
  type: marble
  marble_root: /home/ecs-user/MARBLE
  scenario: database

agents:
  writer:
    role: executor
    memory_access: read_write
  receivers:
    primary:
      - receiver_id: agent1
        role: executor
        memory_access: read_write
      - receiver_id: agent2
        role: executor
        memory_access: read_write
      - receiver_id: agent3
        role: executor
        memory_access: read_write
    analysis:
      - receiver_id: agent1
        role: executor

# Experiment scale — follow MARBLE validation subset
# Full 500 tasks × 5 seeds × 7 methods × 2 branches is prohibitively expensive.
# Use validation-scale subsets and scale up only after sanity checks pass.
scale:
  sanity:
    n_tasks: 10
    seeds: [0, 1, 2]
    methods: [no_memory, full_memory, smtr_tci]
  receiver1:
    n_tasks: 50
    seeds: [0, 1, 2]
    methods: [no_memory, full_memory, retrieval, reflexion, heuristic, agemem, smtr_tci]
  main:
    n_tasks: 50
    seeds: [0, 1, 2]
    methods: [no_memory, full_memory, retrieval, reflexion, heuristic, agemem, smtr_tci]
  contamination:
    n_tasks: 50
    seeds: [0, 1, 2]
    methods: [full_memory, retrieval, smtr_tci]
    ratios: [0.1, 0.2, 0.3]

episodes: 10  # per-task episodes for memory formation tracking
seeds: [0, 1, 2]  # available seeds from paired records

memory:
  budget: null  # null = unlimited
  retrieval_top_k: 3

methods:
  - no_memory
  - full_memory
  - retrieval
  - reflexion
  - heuristic
  - agemem
  - smtr_tci

evaluation:
  metrics:
    - official_score        # MARBLE native evaluator (root-cause match)
    - team_success          # binary success/failure
    - late_stage_score      # last 20% episodes
    - memory_quality        # reuse, transfer, contamination
    - receiver_conditioned  # per-receiver utility delta
  same_task_sequence: true  # paired design: shared InitialStateBundle across methods
  contamination_ratio: 0.2

# LLM runtime
llm:
  model: qwen3-30b-a3b
  base_url: https://llm-jhxtd03gjg0gd2o2.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
  enable_thinking: false

# Data paths
data:
  memory_pool_path: artifacts/marble/real_data/database_v1/memory_pool.jsonl
  paired_records_path: artifacts/marble/paired/train/paired_records.jsonl
  dataset_manifest_path: artifacts/marble/manifests/dataset.json
  split_manifest_path: artifacts/marble/manifests/splits.json

# Output
output:
  root: results/marble
  sanity: results/marble/sanity
  receiver1: results/marble/receiver1
  main: results/marble/main
  contamination: results/marble/contamination

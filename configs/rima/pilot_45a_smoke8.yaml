# Phase 45A pre-v3 smoke — 8-task real adaptive sanity
# Gate before re-burning a 30-task stream (P0 revision directive):
#   probe_count >= 5, refit_count >= 1, controller critic version
#   increases after refit, v1-vs-v2 prediction change observed,
#   runtime causal audit passes. LCB > 0 NOT required.

phase: 45A_smoke8

methods:
  - rima_transfer_adaptive

scenarios:
  count: 1

stream_seeds: [0]
execution_seeds: [0]
probe_seeds: [0]

n_tasks_per_stream: 8

# Artifact paths (same as main pilot)
critic_checkpoint: results/rima_transfer/critic/critic_receiver_bootstrap.joblib
transfer_policy: results/rima_transfer/critic/transfer_policy.json
intervention_records: results/rima/stage_a/intervention_records.json
source_agents: results/rima/stage_a/source_agents.json
split_manifest: results/rima_transfer/critic/split_manifest.json
